name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialises promotions from THIS repo. Cross-repo races are handled
# by the rebase retry loop in the job below.
concurrency:
  group: promote-${{ github.repository }}
  cancel-in-progress: false

env:
  # The ONLY difference from service-2's workflow. Must match the `newName`
  # in kubernetes/service-1/kustomization.yaml, minus the registry and owner.
  IMAGE_NAME: service-1

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # No index override here. Runners carry no Apple pip config, so this
        # already resolves from public PyPI. It is also the reason every pin
        # in requirements-dev.txt must exist there: a version present only on
        # an internal mirror installs on your Mac and fails on this line.
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      # Runs without a database or a service-2. The tests use dependency
      # overrides and a mock transport, which is why Phase 3.2 bothered
      # with them: CI needs no infrastructure at all.
      - name: Test
        run: pytest -v

  build:
    name: build and push
    needs: test
    # No image is published from a pull request. Merged commits only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Computing the next ordinal is a read-modify-write against GHCR: read the
    # highest 26W38B* tag, push one higher. Two overlapping runs would both
    # read B2 and both push B3, and the loser's image would be unreachable.
    # A DIFFERENT group name from the promote job: two jobs in one run sharing
    # a group, where one `needs` the other, deadlock.
    concurrency:
      group: build-${{ github.repository }}
      cancel-in-progress: false

    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}

    steps:
      - uses: actions/checkout@v7
      # QEMU for arm64 emulation, buildx for the multi-arch manifest.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the build tag
        id: tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # GHCR's v2 API wants a bearer that is the base64-encoded token, not
          # the token itself. A registry quirk, not a general pattern.
          BEARER="$(printf '%s' "$GHCR_TOKEN" | base64 -w0)"
          URL="https://ghcr.io/v2/${OWNER}/${IMAGE_NAME}/tags/list?n=1000"

          # Capture the status separately so a 404, meaning the package does
          # not exist yet and this is the first ever build, is handled while
          # anything else is loud. `curl -f` alone collapses those two cases.
          RESPONSE="$(curl -sSL -w '\n%{http_code}' -H "Authorization: Bearer ${BEARER}" "$URL")"
          CODE="$(tail -n1 <<<"$RESPONSE")"
          BODY="$(sed '$d' <<<"$RESPONSE")"

          case "$CODE" in
            200) TAGS="$(jq -r '.tags[]? // empty' <<<"$BODY")" ;;
            404) echo "No existing package; this is the first build."; TAGS="" ;;
            *)   echo "ERROR: GHCR tag list returned HTTP ${CODE}" >&2
                 echo "$BODY" >&2
                 exit 1 ;;
          esac

          BUILD_TAG="$(printf '%s\n' "$TAGS" | ci/next-build-tag.sh)"
          echo "Build tag: ${BUILD_TAG}"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Full commit SHA as the tag. Never `latest`.
          # Two tags, one image. The build tag is what humans and the dev
          # overlay use; the SHA tag is what keeps the image traceable back to
          # a commit. The labels carry the same fact inside the image, so a
          # running pod can be traced without consulting the registry at all.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.build_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.build_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}xww
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: promote to gitops
    # Only runs if `build` succeeded, so a tag is never written for an image
    # that does not exist in GHCR. This ordering is the whole CI/CD seam.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitOps repo
        uses: actions/checkout@v7
        with:
          # Note this checks out a DIFFERENT repo from the one running the
          # workflow. That is why the automatic GITHUB_TOKEN is not enough:
          # it is scoped to this repo only.
          repository: ${{ github.repository_owner }}/lfi-infrastructure-gitops
          token: ${{ secrets.GITOPS_PAT }}
          # Into a subdirectory, so it cannot collide with this repo's files.
          path: gitops

      - name: Update the image tag and push
        working-directory: gitops
        # Passed as env vars rather than interpolated into the script with
        # ${{ }}. Interpolation splices text into the shell before it runs,
        # which is a script-injection route; env vars are just data.
        env:
          # Was SHA. The manifest names the build now, not the commit.
          BUILD_TAG: ${{ needs.build.outputs.build_tag }}
          SERVICE: service-1

        run: |
          set -euo pipefail

          # Commit as the Actions bot. This exact address is what makes the
          # bot avatar render on the commit in the GitHub UI.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Task 10.2.1 moved this. Writing to the old path keeps CI green
          # while dev quietly stops receiving builds.
          
          MANIFEST="kubernetes/overlays/dev/${SERVICE}/kustomization.yaml"

          # yq -i against a missing file does not reliably fail, so check.
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: ${MANIFEST} does not exist." >&2
            exit 1
          fi

          yq -i '.images[0].newTag = strenv(BUILD_TAG)' "$MANIFEST"

          # Re-running the same commit is not an error. Without this guard,
          # `git commit` would fail on an empty diff and fail the pipeline.
          if git diff --quiet; then
            echo "Tag already at ${SHA}. Nothing to promote."
            exit 0
          fi

          git add "$MANIFEST"
          git commit -m "deploy(${SERVICE}): ${SHA}"

          # Both app repos push to this one repo, so a race is normal
          # rather than exceptional. Rebase and retry instead of failing.
          #
          # Rebase, not merge: it replays our single one-line commit on top of
          # theirs, so history stays linear and the two edits touch different
          # files anyway. --autostash covers any stray working-tree change.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Promoted ${SERVICE} to ${SHA} on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}). Rebasing and retrying..."
            git pull --rebase --autostash
            # Back off a little further each time: 3s, 6s, 9s, 12s.
            sleep $(( attempt * 3 ))
          done

          echo "Could not push after 5 attempts." >&2
          exit 1
